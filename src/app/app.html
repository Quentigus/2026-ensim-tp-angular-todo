<fieldset>
  <legend>app.html (signal)</legend>

  <!-- La valeur est synchronisée avec le compteur -->
  Valeur actuelle : {{ mySignal() }}

  <!-- Le parent peut modifier la variable, ce qui fait qu'elle est envoyée à l'enfant -->
  <button (click)="mySignal.set(0)">Reset</button>

  <!-- [(xxx)] = [xxx] + (xxx) = Two-Way data binding => on passe la variable -->
  <app-compteur [(compteur)]="mySignal"></app-compteur>
</fieldset>

<fieldset>
  <legend>app.html (variable)</legend>

  <!-- La valeur est synchronisée avec le compteur -->
  Valeur actuelle : {{ myVariable }}

  <!-- Le parent peut modifier la variable, ce qui fait qu'elle est envoyée à l'enfant -->
  <button (click)="myVariable = 0">Reset</button>

  <!-- [(xxx)] = [xxx] + (xxx) = Two-Way data binding => on passe directement l'instance du signal -->
  <app-compteur [(compteur)]="myVariable"></app-compteur>
</fieldset>
